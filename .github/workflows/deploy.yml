name: Validate Code

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate HTML
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi
          echo "✅ HTML validation passed"
      
      - name: Check files
        run: |
          echo "✅ Files present:"
          ls -la css/
          ls -la js/
          echo "✅ All required files exist"

# Note: Vercel auto-deploys when you connect the GitHub repo in Vercel dashboard
# No need for custom deployment action
